name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/suite.test.js
      # guardrails from the audit: one function, no stray api/ files
      - name: single serverless function
        run: node -e "const fs=require('fs');const n=fs.readdirSync('api').filter(f=>f.endsWith('.js')).length;if(n!==1){console.error('api/ has '+n+' functions (Hobby cap is 12; this project must have exactly 1)');process.exit(1)}"
