async function api(path,opts={},retried){const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+SESSION.access_token,...(opts.headers||{})}});/* 2nd-opinion #18: one refresh + retry before giving up on a long-idle tab. */if(res.status===401&&!retried){try{const {data}=await supabaseClient.auth.refreshSession();if(data&&data.session){SESSION=data.session;return api(path,opts,true)}}catch(_){}location.href='/login.html';return}const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'Request failed');return body}
function money(cents,currency='INR'){return new Intl.NumberFormat('en-IN',{style:'currency',currency,maximumFractionDigits:0}).format((Number(cents)||0)/100)}
function dt(v){if(!v)return '—';return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function pill(status){let cls=status==='recovered'?'ok':(status==='lost'||status==='failed'?'bad':(status==='awaiting_approval'||status==='pending'?'warn':''));return '<span class="pill '+cls+'">'+(status||'—').replace(/_/g,' ')+'</span>'}
</script><script>$$('.navlist a').forEach(a=>{if(a.dataset.page==='digest')a.classList.add('on')});
/* 2nd-opinion #10: mobile navigation. */
(function(){
  var sb=document.querySelector('.sb'), btn=document.getElementById('mnavBtn');
  if(!sb||!btn) return;
  function close(){ sb.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); sb.classList.toggle('open'); btn.setAttribute('aria-expanded', sb.classList.contains('open')?'true':'false'); });
  document.addEventListener('click',function(e){ if(sb.classList.contains('open') && !sb.contains(e.target) && e.target!==btn) close(); });
  sb.addEventListener('click',function(e){ if(e.target.closest('a')) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
/* 2nd-opinion #13: stored data renders via textContent — no innerHTML sink. */
async function boot(){await requireSession();if(!SESSION)return;const list2=$('#digestList');try{let data=await api('/api/digests');let list=data.digests||[];list2.textContent='';if(!list.length){let d=document.createElement('div');d.className='empty';d.textContent='No digests yet — the first one appears after a week of activity.';list2.appendChild(d);return}list.forEach(dg=>{let art=document.createElement('article');art.className='event';let h=document.createElement('h3');h.textContent=dt(dg.weekStartDate)+' – '+dt(dg.weekEndDate);let p=document.createElement('p');p.textContent=dg.aiNarrativeParagraph||'No narrative yet.';let meta=document.createElement('div');meta.className='meta';[ 'Recovered '+money(dg.recoveredAmountCents,'INR'), 'Lost '+money(dg.lostAmountCents,'INR'), Number(dg.totalRecovered||0)+' recovered', Number(dg.totalLost||0)+' lost', dg.sentAt?'Sent '+dt(dg.sentAt):'Not sent' ].forEach(t=>{let s=document.createElement('span');s.textContent=t;meta.appendChild(s)});art.appendChild(h);art.appendChild(p);art.appendChild(meta);list2.appendChild(art)})}catch(e){list2.textContent='';let d=document.createElement('div');d.className='empty';d.textContent=e.message||'Could not load digests.';list2.appendChild(d)}}boot();
