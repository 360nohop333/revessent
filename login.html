<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create your Revessent workspace.">
  <title>Sign in · Revessent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const supabaseClient = supabase.createClient(
      'https://zujmouzzqiovgbnanrvv.supabase.co',
      'sb_publishable_7JoawOBwMZ-ZIFmDrjkHSA_AdIWlCi3'
    );
  </script>
  <style>
    :root {
      --canvas:#f5f3ee;--page:#f1e8d4;--text-primary:#1d1c1a;--text-secondary:#3c3b37;
      --text-muted:#6b6860;--text-faint:#8e8c86;--text-inverse:#fdfcf8;--cc:255 253 247;
      --lc:112 90 55;--edge:rgba(255,255,255,.68);--hi:rgba(255,255,255,.84);
      --glass:rgba(255,253,247,.58);--btnA:#35639a;--btnAtx:#fbf6ec;--acc:#6d9fd6;
      --acc-ink:#35608f;--ok:#8ba889;--ok-ink:#5f7450;--err:#a94f3d;
      --radius-xl:26px;--radius-lg:22px;--radius-md:16px;--radius-sm:12px;
      --spring:cubic-bezier(.16,1,.3,1);
    }
    html[data-theme=dark]{--page:#161512;--text-primary:#efece4;--text-secondary:#c4c6c9;
      --text-muted:#96938c;--text-faint:#78756f;--text-inverse:#161512;--cc:42 40 36;
      --lc:196 198 201;--edge:rgba(224,222,214,.20);--hi:rgba(255,255,255,.13);
      --glass:rgba(39,37,33,.64);--btnA:#c4c6c9;--btnAtx:#1d1b18;--acc:#c4c6c9;
      --acc-ink:#efece4;--ok:#8fa089;--ok-ink:#d5dfc9;--err:#d79a82;color-scheme:dark}
    *{box-sizing:border-box}html{min-width:320px;background:var(--page)}
    body{min-height:100svh;margin:0;overflow-x:hidden;background:var(--page);color:var(--text-primary);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;
      -webkit-font-smoothing:antialiased;transition:color .6s ease,background-color .6s ease}
    button,input{font:inherit}button{border:0;cursor:pointer}a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--acc-ink);outline-offset:3px}
    #sky{position:fixed;z-index:0;inset:0;width:100%;height:100%;pointer-events:none}
    .veil{position:fixed;z-index:1;inset:0;pointer-events:none;
      background:radial-gradient(125% 92% at 50% -4%,rgb(var(--cc)/.50),transparent 47%),
      radial-gradient(150% 120% at 50% 50%,transparent 58%,rgba(94,70,34,.10) 100%)}
    html[data-theme=dark] .veil{background:radial-gradient(125% 92% at 50% -4%,rgba(226,225,219,.06),transparent 46%),
      radial-gradient(150% 120% at 50% 50%,transparent 42%,rgba(0,0,0,.58) 100%),rgba(9,11,16,.12)}
    html[data-theme=dark] #sky{filter:brightness(.72) saturate(.78)}
    .page-shell{position:relative;z-index:2;min-height:100svh}
    .wrap{width:min(1120px,calc(100% - clamp(36px,6.4vw,84px)));margin:0 auto}
    .navbar{position:fixed;top:0;right:0;left:0;z-index:20;border-bottom:1px solid transparent}
    .nav-inner{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:inline-flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;letter-spacing:-.07em}
    .brand-mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6d9fd6,#35639a);box-shadow:0 4px 10px rgba(53,99,154,.25)}
    .brand-dot{color:var(--acc-ink)}
    .nav-right{display:flex;align-items:center;gap:10px}
    .nav-link{padding:8px 14px;color:var(--text-secondary);font-size:13px;font-weight:600;border-radius:999px}
    .nav-link:hover{color:var(--text-primary);background:rgb(var(--cc)/.38)}
    .theme-toggle{position:relative;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--edge);
      border-radius:13px;color:var(--text-secondary);background:rgb(var(--cc)/.45);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 28px -20px rgba(64,48,26,.25);
      backdrop-filter:blur(18px) saturate(1.25);transition:.35s}
    .theme-toggle:hover{transform:translateY(-1px);background:var(--hi)}
    .theme-toggle svg{width:18px;height:18px;grid-area:1/1;transition:.62s var(--spring)}
    .sun-icon{opacity:0;transform:rotate(-80deg) scale(.5)}
    .moon-icon{opacity:1}
    html[data-theme=dark] .sun-icon{opacity:1;transform:none}
    html[data-theme=dark] .moon-icon{opacity:0;transform:rotate(80deg) scale(.5)}
    .auth-stage{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:112px 20px 64px;isolation:isolate}
    .auth-stage:before,.auth-stage:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(46px)}
    .auth-stage:before{width:360px;height:260px;background:radial-gradient(circle,rgba(244,203,177,.28),transparent 68%);transform:translate(-245px,170px)}
    .auth-stage:after{width:330px;height:300px;background:radial-gradient(circle,rgba(132,179,226,.25),transparent 69%);transform:translate(245px,-145px)}
    .auth-card{width:min(420px,100%);padding:30px;border:1px solid var(--edge);border-radius:26px;
      background:linear-gradient(135deg,rgb(var(--cc)/.18),transparent 42%),var(--glass);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 36px 88px -40px rgba(64,48,26,.44);
      backdrop-filter:blur(24px) saturate(1.3);animation:card-in .82s var(--spring)}
    @keyframes card-in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
    .eyebrow{margin:0 0 8px;font:600 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
    h1{margin:0 0 8px;font-size:30px;line-height:1.15;letter-spacing:-.04em}
    .subtitle{margin:0 0 24px;color:var(--text-muted)}
    .field{margin-bottom:15px}
    label{display:block;margin-bottom:7px;font-size:13px;font-weight:600;color:var(--text-secondary)}
    input{width:100%;padding:12px 14px;border:1px solid var(--edge);border-radius:13px;outline:0;
      background:rgb(var(--cc)/.34);color:var(--text-primary);backdrop-filter:blur(10px)}
    input:focus{border-color:var(--acc)}
    .password-row{position:relative}.password-row input{padding-right:70px}
    .show-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 8px;border-radius:8px;
      color:var(--text-muted);background:transparent;font-size:12px}
    .show-btn:hover{background:rgb(var(--cc)/.4);color:var(--text-primary)}
    .actions{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:12px}
    .check{display:flex;align-items:center;gap:7px;color:var(--text-muted)}
    .check input{width:15px;height:15px}
    .link{color:var(--acc-ink);font-weight:600}
    .primary{width:100%;padding:13px 16px;border-radius:13px;background:var(--btnA);color:var(--btnAtx);font-weight:700;
      box-shadow:0 10px 24px -14px rgba(53,99,154,.75);transition:.25s}
    .primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .divider{display:flex;align-items:center;gap:10px;margin:21px 0;color:var(--text-faint);font-size:11px}
    .divider:before,.divider:after{content:"";height:1px;flex:1;background:rgb(var(--lc)/.18)}
    .secondary{width:100%;padding:12px 16px;border:1px solid var(--edge);border-radius:13px;background:rgb(var(--cc)/.25);
      color:var(--text-primary);font-weight:600}
    .secondary:hover{background:var(--hi)}
    .message{min-height:22px;margin:13px 0 0;text-align:center;font-size:12px;color:var(--text-muted)}
    .message.error{color:var(--err)}.message.ok{color:var(--ok-ink)}
    .foot{margin:20px 0 0;text-align:center;color:var(--text-faint);font-size:12px}
    @media(max-width:520px){.auth-card{padding:24px 20px}.auth-stage{padding-left:14px;padding-right:14px}h1{font-size:27px}}
  </style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="veil"></div>

<div class="page-shell">
  <nav class="navbar">
    <div class="nav-inner wrap">
      <a class="brand" href="#"><span class="brand-mark"></span>revessent<span class="brand-dot">.</span></a>
      <div class="nav-right">
        <a class="nav-link" href="#help">Help</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <span class="tt-icon">
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </span>
        </button>
      </div>
    </div>
  </nav>

  <main class="auth-stage">
    <section class="auth-card" aria-labelledby="title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="title">Sign in to Revessent</h1>
      <p class="subtitle">Access your workspace and continue where you left off.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
            <button class="show-btn" type="button" id="showPassword">Show</button>
          </div>
        </div>

        <div class="actions">
          <label class="check"><input type="checkbox" id="remember"> Remember me</label>
          <a class="link" href="#" id="forgot">Forgot password?</a>
        </div>

        <button class="primary" type="submit">Sign in</button>
      </form>

      <div class="divider">OR</div>
      <button class="secondary" id="signupBtn">Create a new workspace</button>
      <p class="message" id="message" aria-live="polite"></p>
      <p class="foot">By continuing, you agree to our terms and privacy policy.</p>
    </section>
  </main>
</div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const password = document.getElementById('password');
  const showPassword = document.getElementById('showPassword');
  const message = document.getElementById('message');

  const savedTheme = localStorage.getItem('revessent-theme');
  if (savedTheme) root.dataset.theme = savedTheme;

  themeToggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    localStorage.setItem('revessent-theme', next);
  });

  showPassword.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    showPassword.textContent = hidden ? 'Hide' : 'Show';
  });

  function setMessage(text, type = '') {
    message.textContent = text;
    message.className = 'message ' + type;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = password.value;
    setMessage('Signing in…');

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email, password: pass
      });
      if (error) throw error;
      try {
        await fetch('/api/onboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ supabaseUserId: data.user ? data.user.id : null, email })
        });
      } catch (onboardErr) { console.warn('Onboarding sync failed:', onboardErr); }
      setMessage('Signed in. Opening your dashboard…', 'ok');
      window.setTimeout(() => { window.location.href = '/dashboard.html'; }, 450);
    } catch (err) {
      setMessage(err.message || 'Unable to sign in.', 'error');
    }
  });

  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const pass = password.value;
    if (!email || !pass) {
      setMessage('Enter an email and password to create an account.', 'error');
      return;
    }
    setMessage('Creating your account…');
    try {
      const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
      if (error) throw error;
      try {
        await fetch('/api/onboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ supabaseUserId: data.user ? data.user.id : null, email })
        });
      } catch (onboardErr) { console.warn('Onboarding sync failed:', onboardErr); }
      setMessage('Account created. Opening your dashboard…', 'ok');
      window.setTimeout(() => { window.location.href = '/dashboard.html'; }, 450);
    } catch (err) {
      setMessage(err.message || 'Unable to create the account.', 'error');
    }
  });

  document.getElementById('forgot').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      setMessage('Enter your email address first.', 'error');
      return;
    }
    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      if (error) throw error;
      setMessage('Password reset email sent.', 'ok');
    } catch (err) {
      setMessage(err.message || 'Unable to send reset email.', 'error');
    }
  });

  // Lightweight animated background.
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let w, h, t = 0;
  function resize() {
    w = canvas.width = innerWidth * devicePixelRatio;
    h = canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  addEventListener('resize', resize);
  resize();

  function draw() {
    t += .003;
    const W = innerWidth, H = innerHeight;
    ctx.clearRect(0,0,W,H);
    const dark = root.dataset.theme === 'dark';
    const g = ctx.createRadialGradient(
      W*.5 + Math.sin(t)*W*.12, H*.25 + Math.cos(t*.8)*H*.08, 20,
      W*.5, H*.5, Math.max(W,H)*.75
    );
    g.addColorStop(0, dark ? 'rgba(92,105,125,.13)' : 'rgba(147,190,231,.20)');
    g.addColorStop(.45, dark ? 'rgba(47,43,38,.10)' : 'rgba(244,219,184,.10)');
    g.addColorStop(1, dark ? 'rgba(15,14,12,.25)' : 'rgba(245,243,238,.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
