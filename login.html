<!doctype html>
<html lang="en" data-theme="finance">
<script>
/* Minimal Finance — apply the shared theme choice (rv.theme) before paint. */
(function(){var t='finance';try{var s=localStorage.getItem('rv.theme')||localStorage.getItem('revessent-theme')||'';
if(s==='slate'||s==='dark'||s==='amoled'||s==='minimal2')t='slate';}catch(_){}
document.documentElement.dataset.theme=t;})();
</script>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>Welcome to Revessent</title>
    <style>
      /* Revessent shared design tokens, matched to dashboard.html. */
      :root {
        color-scheme: light;
        --canvas: #F8FAFC;
        --page: #F8FAFC;
        --text-primary: #1E293B;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --text-inverse: #FFFFFF;
        --text-faint: #94A3B8;
        --ink: var(--text-primary);
        --ink2: var(--text-secondary);
        --ink3: var(--text-muted);
        --glass1: rgba(255, 255, 255, .72);
        --glass2: rgba(255, 255, 255, .88);
        --glass3: #FFFFFF;
        --glass-hi: rgba(255, 255, 255, .9);
        --cc: 255 255 255;
        --lc: 15 23 42;
        --edge: #E2E8F0;
        --hi: #F1F5F9;
        --icB: rgba(15, 23, 42, .06);
        --btnA: #10B981;
        --btnAtx: #FFFFFF;
        --ok: #16A34A;
        --okTx: #15803D;
        --err: #DC2626;
        --accC: 16 185 129;
        --acc: #10B981;
        --acc-ink: #047857;
        --acc-line: rgb(var(--accC) / .35);
        --acc-wash: rgb(var(--accC) / .10);
        --line: rgb(226 232 240);
        --line-soft: rgb(226 232 240 / .55);
        --f-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --r-xl: 24px;
        --r-lg: 18px;
        --r-md: 14px;
        --r-sm: 11px;
        --sh-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 16px -8px rgba(15, 23, 42, .08);
        --sh-md: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 28px -12px rgba(15, 23, 42, .12);
        --sh-lg: 0 1px 2px rgba(15, 23, 42, .06), 0 20px 40px -16px rgba(15, 23, 42, .16);
        --spring: cubic-bezier(.16, 1, .3, 1);
        --pos: #16A34A;
        --pos-ink: #15803D;
        --warn: #D97706;
        --warn-ink: #B45309;
        --neg: #DC2626;
        --neg-ink: #B91C1C;
        --rfx-bg: rgba(255, 255, 255, .92);
        --rfx-border: #E2E8F0;
        --rfx-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px -12px rgba(15, 23, 42, .10);
        --rfx-shadow-hi: 0 2px 4px rgba(15, 23, 42, .06), 0 16px 36px -16px rgba(15, 23, 42, .14);

        /* Aliases used by this standalone auth page. */
        --bg: var(--page);
        --bg-deep: var(--canvas);
        --surface: var(--glass2);
        --surface-solid: var(--rfx-bg);
        --surface-raised: var(--glass3);
        --surface-subtle: rgb(var(--cc) / .08);
        --border: var(--line);
        --border-strong: var(--edge);
        --text: var(--text-primary);
        --accent: var(--acc);
        --accent-strong: var(--acc-ink);
        --accent-soft: var(--acc-wash);
        --gold: var(--warn);
        --danger: var(--neg);
        --success: var(--pos);
        --shadow: var(--sh-lg);
        --radius-lg: var(--r-xl);
        --radius-md: var(--r-lg);
        --radius-sm: var(--r-sm);
        --focus-ring: 0 0 0 3px rgb(var(--accC) / .22);
        --grid-line: rgb(var(--lc) / .055);
        --button-text: var(--btnAtx);
        --button-1-surface: var(--btnA);
        --button-2-surface: var(--acc);
      }

      /* Slate — the dark half of Minimal Finance. */
      html[data-theme="slate"] {
        color-scheme: dark;
        --canvas: #0B1220;
        --page: #0F172A;
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --text-inverse: #0F172A;
        --text-faint: #64748B;
        --glass1: rgba(30, 41, 59, .55);
        --glass2: rgba(30, 41, 59, .78);
        --glass3: #1E293B;
        --glass-hi: rgba(51, 65, 85, .5);
        --cc: 30 41 59;
        --lc: 148 163 184;
        --edge: #334155;
        --hi: rgba(148, 163, 184, .10);
        --icB: rgba(148, 163, 184, .12);
        --btnA: #10B981;
        --btnAtx: #FFFFFF;
        --ok: #34D399;
        --okTx: #6EE7B7;
        --err: #F87171;
        --accC: 16 185 129;
        --acc: #10B981;
        --acc-ink: #34D399;
        --line: rgb(51 65 85);
        --line-soft: rgb(51 65 85 / .55);
        --sh-sm: 0 1px 2px rgba(0, 0, 0, .40), 0 8px 20px -12px rgba(0, 0, 0, .50);
        --sh-md: 0 1px 2px rgba(0, 0, 0, .45), 0 16px 36px -16px rgba(0, 0, 0, .55);
        --sh-lg: 0 1px 2px rgba(0, 0, 0, .50), 0 24px 48px -20px rgba(0, 0, 0, .60);
        --pos: #34D399;
        --pos-ink: #6EE7B7;
        --warn: #FBBF24;
        --warn-ink: #FCD34D;
        --neg: #F87171;
        --neg-ink: #FCA5A5;
        --rfx-bg: rgba(30, 41, 59, .92);
        --rfx-border: #334155;
        --rfx-shadow: 0 1px 2px rgba(0, 0, 0, .40), 0 8px 24px -12px rgba(0, 0, 0, .50);
        --rfx-shadow-hi: 0 2px 4px rgba(0, 0, 0, .45), 0 16px 40px -16px rgba(0, 0, 0, .60);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
        font-family: var(--f-sans);
        text-rendering: optimizeLegibility;
        transition: background-color 180ms ease;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--text);
        background: var(--page);
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        transition: color 600ms ease, background 600ms ease;
      }

      html[data-theme="finance"] body,
      html[data-theme="light"] body,
      html[data-theme="slate"] body {
        background: var(--page);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        content: "";
        background: var(--page);
      }


      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      .page-shell {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        min-height: 100svh;
      }

      .site-header {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 74px;
        margin: 0;
        padding: 0 max(20px, calc((100% - 1120px) / 2));
        border-bottom: 1px solid var(--edge);
        background: linear-gradient(180deg, rgb(var(--cc) / .52), rgb(var(--cc) / .24));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .48), 0 14px 34px -26px rgba(64, 48, 26, .38);
        -webkit-backdrop-filter: blur(24px) saturate(1.35);
        backdrop-filter: blur(24px) saturate(1.35);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--text-primary);
        font-family: var(--f-mono);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.07em;
        text-decoration: none;
      }

      .brand-mark {
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        /* Minimal Finance mark — emerald tile */
        background: #10B981;
        box-shadow: 0 4px 10px rgba(16, 185, 129, .25);
      }

      .brand-dot {
        color: var(--acc-ink);
      }

      .brand-name {
        font: inherit;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-link {
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .nav-link:hover {
        color: var(--text-primary);
        background: rgb(var(--cc) / .38);
      }

      .theme-toggle {
        position: relative;
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--edge);
        border-radius: 13px;
        color: var(--text-secondary);
        cursor: pointer;
        background: rgb(var(--cc) / .45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 10px 28px -20px rgba(64, 48, 26, .25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
        backdrop-filter: blur(18px) saturate(1.25);
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .theme-toggle:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
        background: var(--hi);
        transform: translateY(-1px);
      }

      .theme-toggle svg {
        width: 18px;
        height: 18px;
      }

      .theme-toggle-label {
        display: none;
      }

      main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 112px 20px 64px;
      }

      .login-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(1020px, 100%);
      }

      .intro {
        max-width: 410px;
      }

      .eyebrow {
        display: block;
        margin: 0 0 20px;
        color: var(--acc-ink);
        font: 600 12px var(--f-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 410px;
        margin: 0;
        font-size: clamp(38px, 5vw, 64px);
        font-weight: 760;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      h1 em {
        color: var(--accent);
        font-style: normal;
      }

      .intro-copy {
        max-width: 365px;
        margin: 24px 0 0;
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .signal-list {
        display: grid;
        gap: 12px;
        margin: 38px 0 0;
        padding: 0;
        list-style: none;
      }

      .signal-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 13px;
      }

      .signal-list li::before {
        display: grid;
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(105, 212, 237, 0.26);
        border-radius: 50%;
        color: var(--accent);
        content: "✓";
        font-size: 12px;
        background: var(--accent-soft);
      }

      .auth-card {
        width: min(460px, 100%);
        padding: clamp(22px, 4vw, 34px);
        border: 1px solid var(--edge);
        border-radius: var(--r-xl);
        background: linear-gradient(135deg, rgb(var(--cc) / .18), transparent 42%), var(--surface);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 36px 88px -40px rgba(64, 48, 26, .44);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        backdrop-filter: blur(24px) saturate(1.3);
      }

      .card-heading {
        margin: 0 0 22px;
      }

      .card-heading h2 {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .card-heading p {
        margin: 0;
        color: var(--text-muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 27px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface-subtle);
      }

      .tab {
        min-height: 39px;
        padding: 8px 12px;
        border: 0;
        border-radius: 9px;
        color: var(--text-muted);
        cursor: pointer;
        background: transparent;
        font-size: 13px;
        font-weight: 690;
        transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .tab:hover {
        color: var(--text);
      }

      .tab[aria-selected="true"] {
        color: var(--text);
        background: var(--surface-raised);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .auth-form[hidden] {
        display: none;
      }

      .field {
        display: block;
        margin-bottom: 17px;
      }

      .field-label {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
      }

      .input-wrap {
        position: relative;
      }

      .input-icon {
        position: absolute;
        top: 50%;
        left: 14px;
        width: 17px;
        height: 17px;
        color: var(--text-faint);
        pointer-events: none;
        transform: translateY(-50%);
      }

      input[type="email"],
      input[type="password"] {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 12px 14px 12px 42px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        caret-color: var(--accent);
        background: rgb(var(--cc) / .34);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      input::placeholder {
        color: var(--text-faint);
      }

      input:hover {
        border-color: var(--border-strong);
      }

      input:focus {
        border-color: var(--accent);
        outline: 0;
        box-shadow: var(--focus-ring);
      }

      .form-row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 22px;
        margin: -2px 0 22px;
      }

      .forgot-link {
        border: 0;
        padding: 0;
        color: var(--accent);
        cursor: pointer;
        background: transparent;
        font-size: 12px;
        font-weight: 650;
        text-decoration: none;
      }

      .forgot-link:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .form-message {
        min-height: 0;
        margin: 0 0 16px;
        padding: 0;
        border-radius: 9px;
        font-size: 12px;
        line-height: 1.5;
      }

      .form-message:not(:empty) {
        padding: 11px 12px;
        border: 1px solid var(--border);
        background: var(--surface-subtle);
      }

      .form-message.error {
        border-color: rgba(255, 128, 144, 0.3);
        color: var(--danger);
        background: rgba(255, 128, 144, 0.09);
      }

      .form-message.success {
        border-color: rgba(119, 226, 174, 0.28);
        color: var(--success);
        background: rgba(119, 226, 174, 0.09);
      }

      .form-message.info {
        color: var(--text-muted);
      }

      /* Glass button component, adapted for Revessent actions. */
      .glassy-button {
        --_padding: 0.84rem 1.15rem;
        --_transition-speed: 200ms;
        --_hover-opacity: 0.4;
        --_pressed-opacity: 0.15;
        --_hover-blurriness: 5px;
        --_pressed-blurriness: 10px;
        --_frostiness: 0.3;
        --_hover-offset: 0.35rem;
        --_pressed-offset: 0.18rem;
        --_motion-factor: 0.1;
        --_surface: var(--button-1-surface);

        position: relative;
        display: block;
        width: 100%;
        min-height: 51px;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 13px;
        outline: 0;
        color: var(--button-text);
        cursor: pointer;
        background-color: transparent;
        font-size: 14px;
        font-weight: 760;
        letter-spacing: -0.01em;
      }

      .glassy-button span {
        position: relative;
        z-index: 1;
        display: block;
        overflow: hidden;
        padding: var(--_padding);
        border-radius: inherit;
        background-color: hsl(0 0% 100% / 0);
        -webkit-backdrop-filter: blur(0px);
        backdrop-filter: blur(0px);
        transition: background-color var(--_transition-speed), backdrop-filter var(--_transition-speed), translate var(--_transition-speed), -webkit-backdrop-filter var(--_transition-speed);
      }

      .glassy-button span::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 171 171' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.74' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0;
        transition: opacity var(--_transition-speed);
      }

      .glassy-button::after {
        position: absolute;
        z-index: 0;
        inset: 0;
        border-radius: inherit;
        content: "";
        background-color: var(--_surface);
        transition: scale var(--_transition-speed), translate var(--_transition-speed);
        animation: glassy-exit forwards var(--_transition-speed);
      }

      .glassy-button:hover span,
      .glassy-button:focus-visible span {
        outline: 1px solid hsl(0 0% 100% / 0.7);
        background-color: hsl(0 0% 100% / var(--_hover-opacity));
        -webkit-backdrop-filter: blur(var(--_hover-blurriness));
        backdrop-filter: blur(var(--_hover-blurriness));
        translate: 0 calc(var(--_hover-offset) * -1);
      }

      .glassy-button:hover span::before,
      .glassy-button:focus-visible span::before {
        opacity: var(--_frostiness);
      }

      .glassy-button:hover::after,
      .glassy-button:focus-visible::after {
        scale: 0.96;
        translate: 0 0.1rem;
        animation: glassy-enter forwards var(--_transition-speed);
      }

      .glassy-button:active span {
        -webkit-backdrop-filter: blur(var(--_pressed-blurriness));
        backdrop-filter: blur(var(--_pressed-blurriness));
        background-color: hsl(0 0% 100% / var(--_pressed-opacity));
        translate: 0 calc(var(--_pressed-offset) * -1);
      }

      .glassy-button:active::after {
        scale: 0.9;
        translate: 0 0.2rem;
      }

      .glassy-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .glassy-button:disabled span,
      .glassy-button:disabled:hover span {
        translate: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      .glassy-button.signup-submit {
        --_surface: var(--button-2-surface);
      }

      @keyframes glassy-enter {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(calc(var(--_x-motion, 0px) * var(--_motion-factor) * -1), calc(var(--_y-motion, 0px) * var(--_motion-factor) * -1));
        }
      }

      @keyframes glassy-exit {
        from {
          transform: translate(calc(var(--_x-motion, 0px) * var(--_motion-factor) * -1), calc(var(--_y-motion, 0px) * var(--_motion-factor) * -1));
        }
        to {
          transform: translate(0, 0);
        }
      }

      .fine-print {
        margin: 19px 0 0;
        color: var(--text-faint);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }

      .fine-print a {
        color: var(--text-muted);
        text-underline-offset: 3px;
      }

      .site-footer {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 0 0 25px;
        color: var(--text-faint);
        font-size: 11px;
        text-align: center;
      }

      @media (max-width: 760px) {
        .site-header {
          padding-top: 0;
        }

        main {
          padding-top: 100px;
          padding-bottom: 50px;
        }

        .login-layout {
          grid-template-columns: 1fr;
          gap: 35px;
          width: min(480px, 100%);
        }

        .intro {
          max-width: none;
          text-align: center;
        }

        .intro-copy,
        h1 {
          margin-right: auto;
          margin-left: auto;
        }

        .signal-list {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px 18px;
          margin-top: 25px;
        }

        .signal-list li {
          font-size: 12px;
        }
      }

      @media (max-width: 430px) {
        .site-header {
          width: 100%;
          padding-right: 14px;
          padding-left: 14px;
        }

        .brand-name {
          font-size: 16px;
        }

        .theme-toggle-label {
          display: none;
        }

        main {
          padding-right: 14px;
          padding-left: 14px;
        }

        .auth-card {
          padding: 21px 17px;
          border-radius: 22px;
        }

        .site-footer {
          width: calc(100% - 28px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/login.html" aria-label="Revessent home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">revessent</span><span class="brand-dot">.</span>
        </a>

        <div class="nav-right">
          <a class="nav-link" href="mailto:support@revessent.com">Help</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <span class="theme-toggle-label">Light mode</span>
          </button>
        </div>
      </header>

      <main>
        <div class="login-layout">
          <section class="auth-card" aria-labelledby="authTitle">
            <div class="card-heading">
              <h2 id="authTitle">Welcome back</h2>
              <p>Sign in to your workspace or create a new account.</p>
            </div>

            <div class="tabs" role="tablist" aria-label="Authentication mode">
              <button class="tab" id="signinTab" type="button" role="tab" aria-selected="true" aria-controls="signinPanel">Sign in</button>
              <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false" aria-controls="signupPanel" tabindex="-1">Create account</button>
            </div>

            <form class="auth-form" id="signinPanel" novalidate>
              <label class="field" for="signinEmail">
                <span class="field-label">Email address</span>
                <span class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                  </svg>
                  <input id="signinEmail" name="signinEmail" type="email" autocomplete="email" placeholder="you@company.com" required />
                </span>
              </label>

              <label class="field" for="signinPassword">
                <span class="field-label">Password</span>
                <span class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                  </svg>
                  <input id="signinPassword" name="signinPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required />
                </span>
              </label>

              <div class="form-row">
                <button class="forgot-link" id="forgotPassword" type="button">Forgot password?</button>
              </div>

              <p class="form-message" id="signinMessage" role="alert" aria-live="polite"></p>

              <button class="glassy-button signin-submit" type="submit">
                <span>Sign in</span>
              </button>
            </form>

            <form class="auth-form" id="signupPanel" novalidate hidden>
              <label class="field" for="signupEmail">
                <span class="field-label">Email address</span>
                <span class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                  </svg>
                  <input id="signupEmail" name="signupEmail" type="email" autocomplete="email" placeholder="you@company.com" required />
                </span>
              </label>

              <label class="field" for="signupPassword">
                <span class="field-label">Password</span>
                <span class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                  </svg>
                  <input id="signupPassword" name="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required />
                </span>
              </label>

              <p class="form-message" id="signupMessage" role="alert" aria-live="polite"></p>

              <button class="glassy-button signup-submit" type="submit">
                <span>Create account</span>
              </button>
            </form>

            <p class="fine-print">By continuing, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p>
          </section>
        </div>
      </main>

      <footer class="site-footer">© <span id="currentYear"></span> Revessent. Built for forward motion.</footer>
    </div>

    <!-- Override window.REVESSENT_SUPABASE_CONFIG before this script if you use another project. -->
    <script src="/api/config.js"></script> <!-- audit #66: Supabase project from env, inline fallback below -->
    <script>
      window.REVESSENT_SUPABASE_CONFIG = window.REVESSENT_SUPABASE_CONFIG || {
        url: "https://zujmouzzqiovgbnanrvv.supabase.co",
        anonKey: "sb_publishable_7JoawOBwMZ-ZIFmDrjkHSA_AdIWlCi3"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        "use strict";

        const config = window.REVESSENT_SUPABASE_CONFIG || {};
        const supabaseUrl = config.url || "";
        const supabaseAnonKey = config.anonKey || "";
        const isConfigured = Boolean(
          window.supabase &&
          supabaseUrl &&
          supabaseAnonKey &&
          !supabaseUrl.includes("YOUR_SUPABASE") &&
          !supabaseAnonKey.includes("YOUR_SUPABASE")
        );
        const supabaseClient = isConfigured ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) : null;

        const signinTab = document.getElementById("signinTab");
        const signupTab = document.getElementById("signupTab");
        const signinForm = document.getElementById("signinPanel");
        const signupForm = document.getElementById("signupPanel");
        const signinMessage = document.getElementById("signinMessage");
        const signupMessage = document.getElementById("signupMessage");
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = themeToggle.querySelector(".theme-icon");
        const currentYear = document.getElementById("currentYear");

        currentYear.textContent = new Date().getFullYear();

        function setMessage(element, message, type = "error") {
          element.textContent = message;
          element.className = `form-message${message ? ` ${type}` : ""}`;
        }

        function clearMessages() {
          setMessage(signinMessage, "");
          setMessage(signupMessage, "");
        }

        function activateMode(mode) {
          const isSignin = mode === "signin";
          signinTab.setAttribute("aria-selected", String(isSignin));
          signupTab.setAttribute("aria-selected", String(!isSignin));
          signinTab.tabIndex = isSignin ? 0 : -1;
          signupTab.tabIndex = isSignin ? -1 : 0;
          signinForm.hidden = !isSignin;
          signupForm.hidden = isSignin;
          document.getElementById("authTitle").textContent = isSignin ? "Welcome back" : "Start with Revessent";
          clearMessages();
          (isSignin ? document.getElementById("signinEmail") : document.getElementById("signupEmail")).focus();
        }

        signinTab.addEventListener("click", () => activateMode("signin"));
        signupTab.addEventListener("click", () => activateMode("signup"));

        [signinTab, signupTab].forEach((tab) => {
          tab.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
              event.preventDefault();
              const nextMode = tab === signinTab ? "signup" : "signin";
              activateMode(nextMode);
              (nextMode === "signin" ? signinTab : signupTab).focus();
            }
          });
        });

        function applyTheme(theme) {
          /* Minimal Finance: finance (light) ⇄ slate (dark), shared via rv.theme. */
          const isLight = theme !== "slate";
          document.documentElement.dataset.theme = isLight ? "finance" : "slate";
          themeToggle.setAttribute("aria-pressed", String(isLight));
          themeToggle.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme");
          themeToggle.querySelector(".theme-toggle-label").textContent = isLight ? "Dark mode" : "Light mode";
          themeIcon.innerHTML = isLight
            ? '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"></path>'
            : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>';
          try {
            localStorage.setItem("rv.theme", isLight ? "finance" : "slate");
          } catch (error) {
            // Storage can be unavailable in privacy-focused browser modes.
          }
        }

        let savedTheme = "finance";
        try {
          const saved = localStorage.getItem("rv.theme") || localStorage.getItem("revessent-theme") || "";
          savedTheme = (saved === "slate" || saved === "dark" || saved === "amoled" || saved === "minimal2") ? "slate" : "finance";
        } catch (error) {
          savedTheme = "finance";
        }
        applyTheme(savedTheme);
        themeToggle.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "slate" ? "finance" : "slate"));
        /* A theme picked on any other page follows here instantly. */
        addEventListener("storage", function(e) {
          if (e.key === "rv.theme" && e.newValue) {
            applyTheme(e.newValue === "slate" ? "slate" : "finance");
          }
        });

        function setLoading(form, isLoading, label) {
          const button = form.querySelector("button[type='submit']");
          button.disabled = isLoading;
          button.querySelector("span").textContent = isLoading ? label : (form === signinForm ? "Sign in" : "Create account");
        }

        function validateForm(form, emailInput, passwordInput, messageElement, isSignup) {
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            setMessage(messageElement, "Please fill in both fields", "error");
            (!email ? emailInput : passwordInput).focus();
            return null;
          }

          if (!emailInput.validity.valid) {
            setMessage(messageElement, "Please enter a valid email address.", "error");
            emailInput.focus();
            return null;
          }

          if (isSignup && password.length < 8) {
            setMessage(messageElement, "Your password must be at least 8 characters.", "error");
            passwordInput.focus();
            return null;
          }

          if (!supabaseClient) {
            setMessage(messageElement, "Authentication is not configured yet. Add your Supabase URL and anon key in this file.", "error");
            return null;
          }

          return { email, password };
        }

        async function syncUser(accessToken, refCode) {
          try {
            // SECURITY (audit #1): the API now derives identity from the
            // verified Supabase session token — we never send email/user id
            // in the body. Only the optional referral code travels in body.
            const payload = {};
            if (refCode) payload.ref = refCode;

            const response = await fetch("/api/onboard", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`
              },
              body: JSON.stringify(payload),
              keepalive: true
            });

            if (!response.ok) {
              throw new Error(`Onboarding returned HTTP ${response.status}`);
            }
          } catch (error) {
            console.warn("Revessent onboarding sync failed; continuing to dashboard.", error);
          }
        }

        // Referral system: capture ?ref=CODE from the URL on page load and
        // keep it in sessionStorage so it survives the sign-up form
        // submission, then send it to /api/onboard with the signup.
        try {
          const refParam = new URLSearchParams(window.location.search).get("ref");
          if (refParam && /^[A-Za-z0-9]{3,24}$/.test(refParam)) {
            sessionStorage.setItem("rv.ref", refParam.toUpperCase());
          }
        } catch (_) { /* private mode / disabled storage — referral is optional */ }

        function redirectToDashboard() {
          window.setTimeout(() => {
            window.location.assign("/dashboard.html");
          }, 700);
        }

        signinForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          setMessage(signinMessage, "");
          const emailInput = document.getElementById("signinEmail");
          const passwordInput = document.getElementById("signinPassword");
          const values = validateForm(signinForm, emailInput, passwordInput, signinMessage, false);
          if (!values) return;

          setLoading(signinForm, true, "Signing in…");
          try {
            const { data, error } = await supabaseClient.auth.signInWithPassword(values);
            if (error) throw error;
            if (!data.user) throw new Error("No authenticated user was returned.");

            // Audit #57: await the sync so the dashboard never loads before
            // the Neon user/org exists.
            if (data.session && data.session.access_token) {
              await syncUser(data.session.access_token);
            }
            setMessage(signinMessage, "Signed in successfully. Taking you to your dashboard…", "success");
            redirectToDashboard();
          } catch (error) {
            console.error("Revessent sign-in failed.", error);
            setMessage(signinMessage, error?.message || "We couldn't sign you in. Please check your details and try again.", "error");
            setLoading(signinForm, false);
          }
        });

        signupForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          setMessage(signupMessage, "");
          const emailInput = document.getElementById("signupEmail");
          const passwordInput = document.getElementById("signupPassword");
          const values = validateForm(signupForm, emailInput, passwordInput, signupMessage, true);
          if (!values) return;

          setLoading(signupForm, true, "Creating account…");
          try {
            const { data, error } = await supabaseClient.auth.signUp(values);
            if (error) throw error;
            if (!data.user) throw new Error("No user was returned. Please try again.");

            // Audit #55: with Supabase "Confirm email" ON there is no session
            // after signup — show a check-your-email state instead of
            // pretending to redirect to a dashboard that would 401.
            if (!data.session || !data.session.access_token) {
              setLoading(signupForm, false, "Create account");
              setMessage(
                signupMessage,
                "Account created — check your inbox and confirm your email to continue.",
                "success"
              );
              return;
            }

            // Fresh signup only — pass the stashed referral code (if any)
            // through to /api/onboard, then clear it so a later sign-in can
            // never re-attribute the referral. Audit #57: awaited, not
            // fire-and-forget, so the org exists before the dashboard loads.
            let stashedRef = "";
            try { stashedRef = sessionStorage.getItem("rv.ref") || ""; } catch (_) {}
            await syncUser(data.session.access_token, stashedRef);
            if (stashedRef) { try { sessionStorage.removeItem("rv.ref"); } catch (_) {} }

            setMessage(signupMessage, "Account created successfully. Taking you to your dashboard…", "success");
            redirectToDashboard();
          } catch (error) {
            console.error("Revessent sign-up failed.", error);
            setMessage(signupMessage, error?.message || "We couldn't create your account. Please try again.", "error");
            setLoading(signupForm, false);
          }
        });

        document.getElementById("forgotPassword").addEventListener("click", async () => {
          const emailInput = document.getElementById("signinEmail");
          const email = emailInput.value.trim();
          setMessage(signinMessage, "");

          if (!email) {
            setMessage(signinMessage, "Enter your email address first, then choose forgot password.", "error");
            emailInput.focus();
            return;
          }

          if (!emailInput.validity.valid) {
            setMessage(signinMessage, "Please enter a valid email address.", "error");
            emailInput.focus();
            return;
          }

          if (!supabaseClient) {
            setMessage(signinMessage, "Authentication is not configured yet. Add your Supabase URL and anon key in this file.", "error");
            return;
          }

          const forgotButton = document.getElementById("forgotPassword");
          const originalLabel = forgotButton.textContent;
          forgotButton.disabled = true;
          forgotButton.textContent = "Sending…";

          try {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: `${window.location.origin}/reset-password.html` });
            if (error) throw error;
            setMessage(signinMessage, "If an account exists for that email, you'll receive a password reset link shortly.", "success");
          } catch (error) {
            console.error("Revessent password reset failed.", error);
            setMessage(signinMessage, error?.message || "We couldn't send the reset email. Please try again.", "error");
          } finally {
            forgotButton.disabled = false;
            forgotButton.textContent = originalLabel;
          }
        });

        document.querySelectorAll(".glassy-button").forEach((button) => {
          button.addEventListener("mousemove", (event) => {
            const bounds = button.getBoundingClientRect();
            const offsetX = event.clientX - bounds.left - bounds.width / 2;
            const offsetY = event.clientY - bounds.top - bounds.height / 2;
            button.style.setProperty("--_x-motion", `${offsetX}px`);
            button.style.setProperty("--_y-motion", `${offsetY}px`);
          });
        });
      })();
    </script>
  </body>
</html>
