<!doctype html>
<html lang="en" data-theme="dark">
<script>
/* ECLIPSE — the theme choice (rv.theme) is shared by every page and applied
   before first paint. Default: Eclipse (AMOLED black). */
(function(){var t='light';try{var s=localStorage.getItem('rv.theme')||localStorage.getItem('revessent-theme')||'';
if(s==='light'||s==='amoled'||s==='minimal'||s==='minimal2')t=s;}catch(_){t='light';}
document.documentElement.dataset.theme=(t==='light'||t==='minimal'||t==='minimal2')?t:'dark';})();
addEventListener('storage',function(e){if(e.key==='rv.theme'&&e.newValue){
var v=e.newValue;document.documentElement.dataset.theme=(v==='light'||v==='minimal'||v==='minimal2')?v:'dark';}});
</script>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Reset your password — Revessent</title>
    <!-- Audit #56: the forgot-password email used to dead-end on a 404.
         Supabase's recovery link now lands here (see login.html's
         resetPasswordForEmail redirectTo). A recovery link establishes a
         session (detectSessionInUrl); the new password is set with
         auth.updateUser. No Neon writes — auth lives in Supabase. -->
    <style>
      /* ECLIPSE — true #000000 AMOLED black, electric mint accent. */
      :root {
        color-scheme: dark;
        --canvas: #000000;
        --page: #000000;
        --text: #F2F5F7;
        --text-muted: #8B94A3;
        --text-faint: #6B7482;
        --edge: rgba(255, 255, 255, .10);
        --border: rgba(255, 255, 255, .12);
        --surface: rgba(10, 13, 15, .92);
        --cc: 61 220 151;
        --acc: #3DDC97;
        --acc-tx: #00140C;
        --input-bg: rgba(255, 255, 255, .04);
        --err: #F87B6C;
        --ok: #3DDC97;
        --btn-bg: #3DDC97;
        --btn-tx: #00140C;
        --btn-border: transparent;
        --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 24px 64px -32px rgba(0, 0, 0, .85);
      }
      /* Daylight — the light companion. */
      html[data-theme="light"] {
        color-scheme: light;
        --canvas: #f9f4ea;
        --page: #f1e8d4;
        --text: #1D1C1A;
        --text-muted: #6B6860;
        --text-faint: #8E8C86;
        --edge: rgba(255, 255, 255, .68);
        --border: rgba(64, 48, 26, .16);
        --surface: rgba(255, 253, 247, .55);
        --cc: 255 253 247;
        --acc: #35608f;
        --acc-tx: #ffffff;
        --input-bg: rgba(255, 255, 255, .7);
        --err: #A03A2B;
        --ok: #2F6B3A;
        --btn-bg: rgba(247, 240, 224, .9);
        --btn-tx: #1D1C1A;
        --btn-border: rgba(64, 48, 26, .32);
        --shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 36px 88px -40px rgba(64, 48, 26, .44);
      }
      /* Minimal — white paper, black ink. */
      html[data-theme="minimal"] {
        color-scheme: light;
        --canvas: #ffffff; --page: #ffffff;
        --text: #000000; --text-muted: #5a5a5a; --text-faint: #767676;
        --edge: rgba(0, 0, 0, .16); --border: rgba(0, 0, 0, .22);
        --surface: #ffffff;
        --cc: 255 255 255;
        --acc: #000000; --acc-tx: #ffffff;
        --input-bg: #ffffff;
        --err: #000000; --ok: #000000;
        --btn-bg: #000000; --btn-tx: #ffffff; --btn-border: transparent;
        --shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 24px 64px -32px rgba(0, 0, 0, .22);
      }
      /* Minimal II — the inverse: white ink on black. */
      html[data-theme="minimal2"] {
        color-scheme: dark;
        --canvas: #000000; --page: #000000;
        --text: #ffffff; --text-muted: #8f8f8f; --text-faint: #6f6f6f;
        --edge: rgba(255, 255, 255, .16); --border: rgba(255, 255, 255, .24);
        --surface: #000000;
        --cc: 255 255 255;
        --acc: #ffffff; --acc-tx: #000000;
        --input-bg: rgba(255, 255, 255, .04);
        --err: #ffffff; --ok: #ffffff;
        --btn-bg: #ffffff; --btn-tx: #000000; --btn-border: transparent;
        --shadow: 0 1px 2px rgba(0, 0, 0, .60), 0 24px 64px -32px rgba(0, 0, 0, .85);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(61, 220, 151, .05), transparent 60%),
          linear-gradient(180deg, var(--canvas), var(--page));
      }
      .brand { font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
      .brand span { color: var(--acc); font-weight: 500; }
      .card {
        width: min(440px, 100%);
        padding: clamp(22px, 4vw, 32px);
        border: 1px solid var(--edge);
        border-radius: 22px;
        background: linear-gradient(135deg, rgb(var(--cc) / .10), transparent 42%), var(--surface);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        backdrop-filter: blur(24px) saturate(1.3);
      }
      h1 { margin-bottom: 8px; font-size: 27px; font-weight: 650; letter-spacing: -.04em; line-height: 1.15; }
      .sub { margin-bottom: 22px; color: var(--text-muted); font-size: 14.5px; line-height: 1.6; }
      .field { display: block; margin-bottom: 17px; }
      .field-label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
      .input {
        width: 100%; min-height: 46px; padding: 12px 14px;
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--input-bg); color: var(--text);
        font: inherit; font-size: 14.5px; outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }
      .input:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgb(var(--cc) / .12); }
      .btn {
        width: 100%; min-height: 46px; padding: 12px 16px;
        border: 1px solid var(--btn-border); border-radius: 12px;
        background: var(--btn-bg);
        color: var(--btn-tx); font: inherit; font-size: 14px; font-weight: 700;
        cursor: pointer; transition: transform 140ms ease, box-shadow 140ms ease;
      }
      .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
      .btn:disabled { opacity: .6; cursor: default; }
      .msg { min-height: 20px; margin-top: 14px; font-size: 13px; line-height: 1.55; }
      .msg.error { color: var(--err); }
      .msg.success { color: var(--ok); }
      .back { margin-top: 18px; text-align: center; font-size: 13px; }
      .back a { color: var(--text-muted); }
      .fine-print { color: var(--text-faint); font-size: 11px; text-align: center; }
    </style>
<!-- Glass Kit: shared liquid-glass UI layer (pill CTAs, glass cards, switches) -->
<link rel="stylesheet" href="/glass-kit.css">
<script src="/glass-kit.js" defer></script>
  </head>
  <body>
    <a class="brand" href="/">revessent<span>.</span></a>

    <main class="card" data-liquidglass id="card">
      <h1>Choose a new password</h1>
      <p class="sub">Your reset link is valid for a short time. Pick something you haven't used before.</p>

      <form id="resetForm" novalidate>
        <label class="field" for="newPassword">
          <span class="field-label">New password</span>
          <input class="input" id="newPassword" type="password" name="password" autocomplete="new-password"
                 placeholder="At least 8 characters" required minlength="8" />
        </label>
        <label class="field" for="confirmPassword">
          <span class="field-label">Confirm new password</span>
          <input class="input" id="confirmPassword" type="password" name="confirm" autocomplete="new-password"
                 placeholder="Type it once more" required minlength="8" />
        </label>
        <button class="btn" id="resetBtn" type="submit">Update password</button>
        <p class="msg" id="message" role="status" aria-live="polite"></p>
      </form>

      <p class="back"><a href="/login.html">Back to sign in</a></p>
    </main>

    <p class="fine-print">© <span id="currentYear"></span> Revessent.</p>

    <!-- Same config override pattern as login.html -->
    <script src="/api/config.js"></script> <!-- audit #66: Supabase project from env, inline fallback below -->
    <script>
      window.REVESSENT_SUPABASE_CONFIG = window.REVESSENT_SUPABASE_CONFIG || {
        url: "https://zujmouzzqiovgbnanrvv.supabase.co",
        anonKey: "sb_publishable_7JoawOBwMZ-ZIFmDrjkHSA_AdIWlCi3"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        "use strict";
        document.getElementById("currentYear").textContent = new Date().getFullYear();

        const config = window.REVESSENT_SUPABASE_CONFIG || {};
        const isConfigured = Boolean(
          window.supabase && config.url && config.anonKey &&
          !String(config.url).includes("YOUR_SUPABASE") && !String(config.anonKey).includes("YOUR_SUPABASE")
        );
        const message = document.getElementById("message");
        const form = document.getElementById("resetForm");
        const button = document.getElementById("resetBtn");

        function say(text, type) {
          message.textContent = text || "";
          message.className = "msg" + (text ? " " + (type || "error") : "");
        }

        if (!isConfigured) {
          say("Sign-in is not configured for this deployment. Please contact hello@revessent.com.", "error");
          form.querySelectorAll("input,button").forEach((el) => { el.disabled = true; });
          return;
        }

        const supabaseClient = window.supabase.createClient(config.url, config.anonKey);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          say("");

          const password = document.getElementById("newPassword").value;
          const confirm = document.getElementById("confirmPassword").value;

          if (password.length < 8) { say("Passwords need at least 8 characters."); return; }
          if (password !== confirm) { say("The two passwords don't match."); return; }

          button.disabled = true;
          button.textContent = "Updating…";
          try {
            // The recovery link in the URL established this session
            // (detectSessionInUrl). If it expired, getSession returns null and
            // we tell the user to request a fresh link instead of failing
            // with an opaque auth error.
            const { data: sessionData } = await supabaseClient.auth.getSession();
            if (!sessionData || !sessionData.session) {
              say("This reset link has expired or was already used. Please request a new one from the sign-in page.");
              return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) throw error;

            say("Password updated. Taking you to sign in…", "success");
            setTimeout(() => { window.location.assign("/login.html"); }, 1400);
          } catch (error) {
            console.error("Revessent password reset failed.", error);
            say(error?.message || "We couldn't update your password. Please request a new reset link.", "error");
            button.disabled = false;
            button.textContent = "Update password";
          }
        });
      })();
    </script>
  </body>
</html>
