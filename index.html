  --text-secondary:#3C3B37;
  --text-muted:#6B6860;
  --text-inverse:#FDFCF8;
  --text-faint:#8E8C86;
  /* legacy aliases — keep --ink vars working for any external/JS refs */
  --ink:var(--text-primary);
  --ink2:var(--text-secondary);
