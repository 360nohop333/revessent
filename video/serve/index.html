<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revessent — ad previews</title>
<style>
  body { margin:0; background:#06070a; color:#F2F5F7; font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color:#3DDC97; }
  p.hint { color:#8B94A3; font-size: 14px; margin: 6px 0 22px; }
  video { width: 100%; border-radius: 12px; background:#000; border: 1px solid rgba(255,255,255,.08); display:block; }
  .main video { box-shadow: 0 30px 80px -30px rgba(0,0,0,.9); }
  .label { font-size: 12px; font-family: ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color:#3DDC97; margin: 26px 0 8px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid .label { margin-top: 8px; }
  .label a { color: inherit; text-decoration: none; }
  .label small { color:#8B94A3; letter-spacing: .04em; text-transform: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>revessent<span>.</span> — ad previews</h1>
  <p class="hint">Click the speaker icon in the player for sound. Files are in <code>video/renders/</code>.</p>

  <div class="label">30-second master · 16:9 · 1920×1080 <small>— the one you asked for</small></div>
  <div class="main"><video src="./master30-16x9.mp4" controls autoplay muted playsinline></video></div>

  <div class="label">Other cuts</div>
  <div class="grid">
    <div>
      <video src="./master30-9x16.mp4" controls muted playsinline></video>

    </div>
    <div>
      <video src="./master30-1x1.mp4" controls muted playsinline></video>
      <div class="label">Master 1:1 <small>· feed</small></div>
    </div>
    <div>
      <video src="./cutdown15-16x9.mp4" controls muted playsinline></video>
      <div class="label">Cutdown 15s · 16:9</div>
    </div>
    <div>
      <video src="./cutdown15-9x16.mp4" controls muted playsinline></video>
      <div class="label">Cutdown 15s · 9:16</div>
    </div>
    <div>
      <video src="./cutdown15-1x1.mp4" controls muted playsinline></video>
      <div class="label">Cutdown 15s · 1:1</div>
    </div>
  </div>
</div>
</body>
</html>
